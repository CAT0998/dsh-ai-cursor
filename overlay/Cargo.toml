[package]
name = "ai-mouse-overlay"
version = "0.1.0"
edition = "2021"
description = "Click-through AI cursor overlay for DeepSeek Harness"

[[bin]]
name = "ai-mouse-overlay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Raster decoding: PNG / JPEG / GIF (animated) / WebP / BMP / ICO / TIFF.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tiff",
] }
# SVG rasterisation: a maintained implementation instead of hand-rolled parsing.
resvg = "0.45"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  # Minimap capture on the GPU: Desktop Duplication + a D3D11 pixel shader.
  # See src/gpucap.rs and the P9 note in docs/ROADMAP.md.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
