[package]
name = "ai-mouse-overlay"
version = "0.1.0"
edition = "2021"
description = "Click-through AI cursor overlay for DeepSeek Harness"

[[bin]]
name = "ai-mouse-overlay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Raster decoding: PNG / JPEG / GIF (animated) / WebP / BMP / ICO / TIFF.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tiff",
] }
# SVG rasterisation: a maintained implementation instead of hand-rolled parsing.
resvg = "0.45"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
